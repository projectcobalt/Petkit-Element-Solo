blueprint:
  name: Element Solo - Scheduled Feeding and Supervision
  description: 'Schedule and supervise one ESPHome Element Solo feeder. Create one
    automation from this blueprint for each feeder, or multiple automations for the
    same feeder when different schedules require different portion counts.

    '
  domain: automation
  author: projectcobalt
  source_url: https://github.com/projectcobalt/Petkit-Element-Solo/blob/main/blueprints/automation/element-solo-feeding.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    feeder:
      name: Feeder
      icon: mdi:food
      collapsed: false
      input:
        feeder_device:
          name: Feeder device
          description: Select the PETKIT Element Solo feeder to schedule and supervise.
            The blueprint discovers its entities automatically; keep their default
            entity ID suffixes.
          selector:
            device:
              filter:
              - integration: esphome
                model: petkit-element-solo
              multiple: false
    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      collapsed: false
      input:
        schedule_triggers:
          name: Feeding schedule
          description: Add one or more triggers that should request a feed.
          selector:
            trigger: {}
        feed_portions:
          name: Feed portions
          description: Number of portions requested for each schedule trigger.
          default: 1
          selector:
            number:
              min: 1.0
              max: 6.0
              step: 1.0
              mode: slider
              unit_of_measurement: portions
        feed_conditions:
          name: Additional feed conditions
          description: Optional conditions that must pass before a scheduled feed.
          default: []
          selector:
            condition: {}
        completion_timeout:
          name: Completion timeout
          description: 'Maximum time to wait for feed completion, rejection, or jam
            confirmation.

            '
          default:
            minutes: 2
          selector:
            duration:
              enable_second: true
    warnings:
      name: Warning thresholds
      icon: mdi:alert-outline
      collapsed: true
      input:
        low_battery_voltage:
          name: Low battery voltage
          description: Notify when battery voltage remains below this value.
          default: 5.5
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 0.1
              mode: box
              unit_of_measurement: V
        warning_delay:
          name: Power warning delay
          description: Require the power condition to persist before notifying.
          default:
            minutes: 5
          selector:
            duration:
              enable_second: true
    notifications:
      name: Notifications
      icon: mdi:bell-outline
      collapsed: true
      input:
        error_notification_actions:
          name: Error notification actions
          description: 'Actions for failed, rejected, jammed, or unconfirmed feeds.
            Templates may use notification_title and notification_message.

            '
          default: []
          selector:
            action: {}
        warning_notification_actions:
          name: Power warning notification actions
          description: 'Actions for DC loss or low battery warnings. Templates may
            use notification_title and notification_message.

            '
          default: []
          selector:
            action: {}
        success_notification_actions:
          name: Success notification actions
          description: 'Optional actions after a verified feed. Templates may use
            notification_title and notification_message.

            '
          default: []
          selector:
            action: {}
mode: single
max_exceeded: silent
variables:
  feeder_device: !input feeder_device
  feeder_name: '{{ device_attr(feeder_device, ''name_by_user'') or device_attr(feeder_device,
    ''name'') or ''Petkit Element Solo'' }}'
  feed_now: '{{ device_entities(feeder_device) | select(''match'', ''^button\..*_feed_now$'')
    | list | first | default('''') }}'
  feed_portions_entity: '{{ device_entities(feeder_device) | select(''match'', ''^number\..*_feed_portions$'')
    | list | first | default('''') }}'
  feeder_event: '{{ device_entities(feeder_device) | select(''match'', ''^event\..*_feeder_event$'')
    | list | first | default('''') }}'
  feeder_state: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_feeder_state$'')
    | list | first | default('''') }}'
  last_feed_portions: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_last_feed_portions$'')
    | list | first | default('''') }}'
  food_drop_pulses: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_food_drop_pulses$'')
    | list | first | default('''') }}'
  battery_power_active: '{{ device_entities(feeder_device) | select(''match'', ''^binary_sensor\..*_battery_power_active$'')
    | list | first | default('''') }}'
  battery_voltage: '{{ device_entities(feeder_device) | select(''match'', ''^sensor\..*_battery_pack_voltage$'')
    | list | first | default('''') }}'
  feed_portions: !input feed_portions
  low_battery_voltage: !input low_battery_voltage
triggers:
- triggers: !input schedule_triggers
- trigger: template
  value_template: '{{ battery_power_active != '''' and is_state(battery_power_active,
    ''on'') }}'
  for: !input warning_delay
  id: battery_power
- trigger: template
  value_template: "{{ battery_voltage != '' and\n   states(battery_voltage) not in
    ['unknown', 'unavailable'] and\n   states(battery_voltage) | float(999) < low_battery_voltage
    | float }}"
  for: !input warning_delay
  id: low_battery
- trigger: template
  value_template: "{{ states(feeder_event) if feeder_event != '' and\n   state_attr(feeder_event,
    'event_type') == 'feed_jammed' else false }}"
  id: feeder_jammed
- trigger: template
  value_template: "{{ states(feeder_event) if feeder_event != '' and\n   state_attr(feeder_event,
    'event_type') == 'feed_rejected' else false }}"
  id: feeder_rejected
actions:
- choose:
  - conditions:
    - condition: trigger
      id: battery_power
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} power warning'
        notification_message: '{{ feeder_name }} is running on battery power. Check
          its DC power supply.

          '
    - choose:
      - conditions: '{{ true }}'
        sequence: !input warning_notification_actions
  - conditions:
    - condition: trigger
      id: low_battery
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} low battery'
        notification_message: '{{ feeder_name }} battery voltage is {{ states(battery_voltage)
          }} V, below the configured {{ low_battery_voltage }} V threshold.

          '
    - choose:
      - conditions: '{{ true }}'
        sequence: !input warning_notification_actions
  - conditions:
    - condition: trigger
      id: feeder_jammed
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} jammed'
        notification_message: '{{ feeder_name }} could not complete a feed after its
          anti-jam retries. Check the dispensing mechanism.

          '
    - choose:
      - conditions: '{{ true }}'
        sequence: !input error_notification_actions
  - conditions:
    - condition: trigger
      id: feeder_rejected
    sequence:
    - variables:
        notification_title: '{{ feeder_name }} feed rejected'
        notification_message: '{{ feeder_name }} rejected a feed request because it
          was invalid or the feeder was already busy.

          '
    - choose:
      - conditions: '{{ true }}'
        sequence: !input error_notification_actions
  default:
  - condition: and
    conditions: !input feed_conditions
  - choose:
    - conditions: "{{ feed_now == '' or feed_portions_entity == '' or\n   states(feeder_event)
        in ['unknown', 'unavailable'] or\n   states(feeder_state) in ['unknown', 'unavailable']
        or\n   states(last_feed_portions) in ['unknown', 'unavailable'] or\n   states(food_drop_pulses)
        in ['unknown', 'unavailable'] }}\n"
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} unavailable'
          notification_message: '{{ feeder_name }} could not be reached, so the scheduled
            feed was not attempted.

            '
      - choose:
        - conditions: '{{ true }}'
          sequence: !input error_notification_actions
      - stop: Feeder entities are unavailable
    - conditions: '{{ states(feeder_state) in [''Dispensing'', ''Clearing jam''] }}

        '
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} feed skipped'
          notification_message: '{{ feeder_name }} is already {{ states(feeder_state)
            | lower }}, so the scheduled feed was skipped.

            '
      - choose:
        - conditions: '{{ true }}'
          sequence: !input error_notification_actions
      - stop: Feeder is busy
    - conditions: '{{ states(feeder_state) == ''Jammed'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} is jammed'
          notification_message: '{{ feeder_name }} has an unresolved jam, so the scheduled
            feed was not attempted.

            '
      - choose:
        - conditions: '{{ true }}'
          sequence: !input error_notification_actions
      - stop: Feeder is jammed
  - action: number.set_value
    target:
      entity_id: '{{ feed_portions_entity }}'
    data:
      value: '{{ feed_portions | int }}'
  - action: button.press
    target:
      entity_id: '{{ feed_now }}'
    continue_on_error: true
  - wait_for_trigger:
    - trigger: template
      value_template: "{{ states(feeder_event) if feeder_event != '' and\n   state_attr(feeder_event,
        'event_type') in\n   ['feed_completed', 'feed_jammed', 'feed_rejected'] else
        false }}"
    timeout: !input completion_timeout
    continue_on_timeout: true
  - variables:
      result_event: "{{ 'timeout' if wait.trigger is none else\n   wait.trigger.to_state.attributes.event_type
        | default('unknown') }}\n"
  - choose:
    - conditions: '{{ result_event == ''feed_completed'' }}'
      sequence:
      - delay: "00:00:01"
      - variables:
          reported_portions: '{{ states(last_feed_portions) | int(0) }}'
          reported_food_pulses: '{{ states(food_drop_pulses) | int(0) }}'
      - choose:
        - conditions: '{{ (reported_portions | int) != (feed_portions | int) }}

            '
          sequence:
          - variables:
              notification_title: '{{ feeder_name }} portion mismatch'
              notification_message: '{{ feeder_name }} reported {{ reported_portions
                }} portions after a request for {{ feed_portions | int }}.

                '
          - choose:
            - conditions: '{{ true }}'
              sequence: !input error_notification_actions
        - conditions: '{{ (reported_food_pulses | int) <= 0 }}'
          sequence:
          - variables:
              notification_title: '{{ feeder_name }} food not detected'
              notification_message: '{{ feeder_name }} completed {{ reported_portions
                }} portions but detected no food drops. Check the hopper and chute.

                '
          - choose:
            - conditions: '{{ true }}'
              sequence: !input error_notification_actions
        default:
        - variables:
            notification_title: '{{ feeder_name }} feed completed'
            notification_message: '{{ feeder_name }} completed {{ reported_portions
              }} portions and detected {{ reported_food_pulses }} food drop pulses.

              '
        - choose:
          - conditions: '{{ true }}'
            sequence: !input success_notification_actions
    - conditions: '{{ result_event == ''feed_jammed'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} jammed'
          notification_message: '{{ feeder_name }} could not complete the scheduled
            feed after its anti-jam retries. Check the dispensing mechanism.

            '
      - choose:
        - conditions: '{{ true }}'
          sequence: !input error_notification_actions
    - conditions: '{{ result_event == ''feed_rejected'' }}'
      sequence:
      - variables:
          notification_title: '{{ feeder_name }} feed rejected'
          notification_message: '{{ feeder_name }} rejected the scheduled request
            for {{ feed_portions | int }} portions.

            '
      - choose:
        - conditions: '{{ true }}'
          sequence: !input error_notification_actions
    default:
    - variables:
        notification_title: '{{ feeder_name }} feed unconfirmed'
        notification_message: '{{ feeder_name }} did not confirm the scheduled feed
          before the timeout. Check its connection and feeder state.

          '
    - choose:
      - conditions: '{{ true }}'
        sequence: !input error_notification_actions
